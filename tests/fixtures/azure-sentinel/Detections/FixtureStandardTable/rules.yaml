id: fixture-standard-one
query: |
  FixtureStandardTable
  | where Sourceaddress == "192.0.2.1"
  | project TimeGenerated, Sourceaddress, DestinationAddress
---
id: fixture-standard-two
query: |
  FixtureStandardTable
  | where DestinationAddress == "198.51.100.1"
  | project TimeGenerated, SourceAddress, DestinationAddress
---
id: fixture-standard-three
query: |
  FixtureStandardTable
  | where isnotempty(SourceAddress)
  | extend RiskScore = 1
  | where RiskScore > 0
  | project TimeGenerated, SourceAddress, DestinationAddress