name: Validate baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate data on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate baseline
        run: ./scripts/Test-Baseline.ps1

      - name: Test validation and packaging
        run: ./tests/Test-Baseline.Tests.ps1

      - name: Test offline field analysis
        run: ./tests/Test-FieldAnalysis.Tests.ps1

      - name: Test table catalog review
        run: ./tests/Test-TableCatalog.Tests.ps1
