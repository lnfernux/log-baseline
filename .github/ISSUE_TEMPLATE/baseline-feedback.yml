name: Baseline feedback
description: Suggest a correction to a pre-made Microsoft Sentinel baseline
title: "[Baseline]: "
labels: ["baseline-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        These baselines are generic and environment context takes precedence. Use public evidence and do not include tenant identifiers, customer data, credentials, or private telemetry.
  - type: dropdown
    id: level
    attributes:
      label: Baseline level
      options:
        - Minimum
        - Recommended
        - Plus
    validations:
      required: true
  - type: input
    id: baseline-version
    attributes:
      label: Baseline version
      description: Enter the version shown by the website or manifest.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Suggested change
      options:
        - Add a table
        - Remove a table
        - Change the baseline guidance
        - Other
    validations:
      required: true
  - type: input
    id: table
    attributes:
      label: Sentinel table
      description: Enter the exact table name when the suggestion adds or removes a table.
      placeholder: CommonSecurityLog
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: State the current behavior, proposed change, and concise rationale.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence
      description: Link Microsoft Learn, vendor documentation, standards, or public detection content.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I confirm this issue contains no credentials, tenant identifiers, customer data, or private telemetry.
          required: true