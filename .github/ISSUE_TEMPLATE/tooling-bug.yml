name: Validation or automation bug
description: Report a problem with schemas, validation, or update workflows
title: "[Tooling]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command and sanitized output.
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: 7.6.0
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I removed credentials, tenant identifiers, customer data, and private telemetry.
          required: true
